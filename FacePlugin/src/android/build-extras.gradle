// Read by cordova-android from the app module / project root (always applied when present).
// CameraX + engine AAR must live here — not only in aarintegration.gradle — because a
// prepare that never ran `cordova plugin add` leaves gradleReference unregistered while
// sources still land in the app module.
ext.cdvMinSdkVersion = 24

repositories {
    google()
    mavenCentral()
    flatDir {
        dirs 'src/main/libs'
    }
}

dependencies {
    implementation(name: 'facerecognitionsdk', ext: 'aar')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    def camerax = '1.4.2'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
}

android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packagingOptions {
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/LICENSE'
    }
    // Same as Face-Recognition Capacitor / React Native:
    // init() dlopens libFaceRecognitionEngine.so by filesystem path under nativeLibraryDir.
    packaging {
        jniLibs {
            useLegacyPackaging = true
            pickFirsts += ['**/libc++_shared.so']
        }
    }
    // frc.fpk must be stored (not deflated) for AAsset RANDOM/seek during model load.
    androidResources {
        noCompress += ['fpk']
    }
}
